# Runs every test on each push and pull request, on Windows (like Mission Control's).
# Guide: Meat and Potatoes/01-Architecture.md
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test KspFlightLab.slnx --configuration Release
